server {
    listen 80;
    server_name _;
    charset utf-8;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        # Only reachable through try_files: a request for /index.php itself is a 404.
        internal;

        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

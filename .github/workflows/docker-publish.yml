# On every release tag (v1.0.0, v1.1.0 …) GitHub builds the two images from
# the Dockerfile and pushes them to ghcr.io. docker-compose.yml names these
# images, so `docker compose up` downloads them instead of building locally.
name: Publish Docker images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is created by GitHub for this run; no secret to set up.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags 1.0.0 and 1.0 from the git tag, plus latest (flavor latest=auto).
      - id: app-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aj686/api-automation
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aj686/api-automation-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reuses the app stage built above (same builder), then adds nginx.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
